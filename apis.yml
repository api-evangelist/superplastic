description: Superplastic is a designer-toy and entertainment brand that creates animated synthetic
  celebrities and collectible vinyl art toys, including the characters Janky, Guggimon, and Staffie,
  sold through its Shopify-powered online store. Based in Burlington, Vermont, the company blends
  animation, streetwear-style limited-edition drops, and collectible figures. It is a direct-to-consumer
  commerce and social-media brand and does not publish a public developer API; this profile captures its
  web and domain-security posture only.
